services:
  mysql:
    image: mysql:8.4
    container_name: lazybrain-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lazybrain}
      MYSQL_USER: ${MYSQL_USER:-lazybrain}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - lazybrain_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
volumes:
  lazybrain_mysql_data:
