server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html,text/css,application/javascript
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never
spring:
  config:
    import: "optional:file:../.env[.properties]"
  application:
    name: lazy-developers-second-brain
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lazybrain}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:lazybrain}
    password: ${DB_PASSWORD:change-this-local-password}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: "${OLLAMA_MODEL:qwen3.5:9b}"
          temperature: 0.2
          num-ctx: 8192
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  git:
    command-timeout-seconds: 8
    max-output-bytes: 200000
